name: SAP Blog Publisher (3 articles/day)

on:
  schedule:
    # Hourly check (off-peak minute). GitHub delays/skips cron runs, so each run
    # publishes only what today's plan still owes (scripts/publish_due.py):
    # 1 new article by 8:45 AM IST, 1 rewrite by 2:10 PM, 2nd new by 7:35 PM.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = whatever is due now, new = publish a new article, refresh = rewrite an old thin one"
        type: choice
        options: [auto, new, refresh]
        default: auto

permissions:
  contents: write

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Research, write and publish an SAP article
    env:
      # Any one is enough. New articles use Gemini (free); rewrites use Claude Pro.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "anthropic>=2.6,<3" "google-genai>=3,<4" "cairosvg>=2.7"
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Write and publish what is due
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            python3 scripts/publish_due.py
          else
            python3 scripts/auto_daily_blog_scheduler.py --mode "$MODE"
          fi
          python3 scripts/build_sitemap.py

      # Vercel is connected to this repo and deploys every push to main,
      # so committing the new article is what publishes it.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog index.html logs sitemap.xml robots.txt content docs vercel.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "feat(blog): automated article"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
