name: Twice-Daily Autonomous SAP Blog Publisher

on:
  schedule:
    # 9:00 AM IST = 03:30 AM UTC
    - cron: '30 3 * * *'
    # 7:30 PM IST = 14:00 (2:00 PM) UTC
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    name: Run Twice-Daily Content Research & SEO Publishing Routine
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Autonomous Blog Scheduler
        run: |
          python3 scripts/auto_daily_blog_scheduler.py

      - name: Commit and Push Updated Articles & JS Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(blog): automated twice-daily blog publication"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "blog/* index.html logs/*"

      - name: Set up Node.js
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Live to Vercel (youronementor.com)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"${VERCEL_PROJECT_ID:-prj_A2vf9EEEQYSHia9twNwZtXy63oZL}\",\"orgId\":\"${VERCEL_ORG_ID:-team_Sd9NTal1Q6HqsMPsBpa3KDoh}\",\"projectName\":\"sap-mm-ewm-courses\"}" > .vercel/project.json
          npx vercel --prod --token "$VERCEL_TOKEN" --yes


