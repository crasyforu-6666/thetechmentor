name: Three-Times-Daily SAP Blog Publisher

on:
  schedule:
    # 9:00 AM IST  = 03:30 UTC -> new article
    - cron: '30 3 * * *'
    # 2:30 PM IST  = 09:00 UTC -> rewrite one old thin article (or new if none left)
    - cron: '0 9 * * *'
    # 8:00 PM IST  = 14:30 UTC -> new article
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "new = publish a new article, refresh = rewrite the thinnest old one"
        type: choice
        options: [new, refresh]
        default: new

permissions:
  contents: write

concurrency:
  group: blog-publisher
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Research, write and publish an SAP article
    env:
      # Any one is enough. New articles use Gemini (free); rewrites use Claude Pro.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "anthropic>=2.6,<3" "google-genai>=3,<4" "cairosvg>=2.7"
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Choose mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "mode=refresh" >> "$GITHUB_OUTPUT"
          else
            echo "mode=new" >> "$GITHUB_OUTPUT"
          fi

      - name: Write and publish article
        run: |
          python3 scripts/auto_daily_blog_scheduler.py --mode "${{ steps.mode.outputs.mode }}"
          python3 scripts/build_sitemap.py

      # Vercel is connected to this repo and deploys every push to main,
      # so committing the new article is what publishes it.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog index.html logs sitemap.xml robots.txt content docs/SCREENSHOTS-TODO.md 2>/dev/null || git add blog index.html logs sitemap.xml robots.txt content
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "feat(blog): automated article (${{ steps.mode.outputs.mode }})"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
